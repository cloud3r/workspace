<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/search-engine/">
  <meta charset="UTF-8">

  <title>Search Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Poppins:wght@400&display=swap" rel="stylesheet">
  <style>
:root{
  --text:#222;
  --accent:#6c63e0;
  --muted:#9a9a9a;
  --surface:#f9f9f9;
  --border:#f0f0f0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Outfit",system-ui,sans-serif;
  color:var(--text);
  background:#fff;
  display:flex;
  flex-direction:column;
}

.topbar{
  display:flex;
  justify-content:flex-end;
  padding:20px 24px;
  min-height:70px;
}
.weather{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.weather__temp{font-size:20px;font-weight:600}
.weather__city{font-size:13px;font-weight:500;color:var(--accent)}

.hero{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:0 24px 12vh;
}
.clock{
  font-size:64px;
  font-weight:600;
  line-height:99px;
  letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
}
.greeting{
  font-size:28px;
  font-weight:600;
  line-height:48px;
  color:var(--accent);
  margin-bottom:20px;
}

.search{
  width:100%;
  max-width:622px;
  height:61px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 20px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  color:var(--muted);
}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none}
.search input{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  font:400 15px "Poppins",system-ui,sans-serif;
  color:var(--text);
}
.search input::placeholder{color:var(--muted)}

.shortcuts{
  list-style:none;
  width:100%;
  max-width:622px;
  margin-top:40px;
  display:flex;
  justify-content:space-between;
  gap:12px;
}
.shortcuts a{
  width:65px;
  height:65px;
  display:grid;
  place-items:center;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  color:var(--muted);
  transition:background .15s,border-color .15s;
}
.shortcuts a:hover,.shortcuts a:focus-visible{background:#f1f1f1;border-color:#e4e4e4;outline:0}
.shortcuts svg{width:28px;height:28px}

@media (max-width:560px){
  .clock{font-size:48px;line-height:72px}
  .greeting{font-size:22px}
  .shortcuts a{width:48px;height:48px;border-radius:12px}
  .shortcuts svg{width:22px;height:22px}
}
</style>
</head>
